name: Daily connection check

on:
  schedule:
    # 09:00 Japan time; scheduled delivery can be delayed by GitHub.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-connection-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check configured targets once
        env:
          MONITOR_TARGETS: ${{ secrets.MONITOR_TARGETS }}
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def check_targets(targets):
              failed = False
              for index, target in enumerate(targets, 1):
                  for step_index, item in enumerate(target['requests'], 1):
                      label = f'Target {index}, check {step_index}'
                      try:
                          url = urllib.parse.urlsplit(item['url'])
                          if url.scheme != 'https' or not url.hostname or url.username or url.password:
                              raise ValueError('Invalid HTTPS target')
                          request = urllib.request.Request(item['url'], headers=item.get('headers', {}), method='GET')
                          with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                              if response.status != 200:
                                  raise ValueError('Unexpected status')
                              body = response.read(65537)
                              if item['kind'] == 'html':
                                  if b'<html' not in body.lower():
                                      raise ValueError('Invalid page')
                              elif item['kind'] == 'settings':
                                  data = json.loads(body)
                                  if not isinstance(data, dict) or not isinstance(data.get('settings'), dict) or data['settings'].get('id') != 'main':
                                      raise ValueError('Invalid settings')
                              elif item['kind'] == 'rows':
                                  data = json.loads(body)
                                  if not isinstance(data, list) or not data or data[0].get('id') != item['expected_id']:
                                      raise ValueError('Invalid database row')
                              else:
                                  raise ValueError('Unknown response kind')
                          print(f'{label}: OK')
                      except urllib.error.HTTPError as error:
                          print(f'::error::{label}: HTTP {error.code}')
                          failed = True
                      except Exception:
                          # Keep URLs, headers, response bodies and credentials out of public logs.
                          print(f'::error::{label}: connection or response validation failed')
                          failed = True
              return int(failed)

          try:
              targets = json.loads(os.environ['MONITOR_TARGETS'])
              if not isinstance(targets, list) or len(targets) != 3:
                  raise ValueError('Invalid configuration')
          except Exception:
              print('::error::Missing or invalid target configuration')
              sys.exit(1)
          sys.exit(check_targets(targets))

      - name: Maintain monthly schedule activity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import base64
          import datetime
          import json
          import os
          import urllib.request

          # Public scheduled workflows can be disabled after 60 days of repo inactivity.
          # Update only this harmless marker once a month; never fetch or execute repo code.
          month = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m')
          url = 'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/contents/schedule-activity.txt'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
              current = json.load(response)
          content = base64.b64decode(current['content']).decode().strip()
          if content != month:
              payload = {'message': 'Maintain scheduled workflow activity', 'sha': current['sha'],
                         'content': base64.b64encode((month + '\n').encode()).decode()}
              request = urllib.request.Request(url, headers=headers, data=json.dumps(payload).encode(), method='PUT')
              with urllib.request.urlopen(request, timeout=20) as response:
                  json.load(response)
              print('Monthly schedule marker updated.')
          else:
              print('Schedule marker is current.')
